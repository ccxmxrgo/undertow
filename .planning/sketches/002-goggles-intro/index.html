<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNDERTOW Goggles Intro</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  html, body { height: 100%; overflow: hidden; margin: 0; background: #02040a; color: #e8e6f0; font-family: "Share Tech Mono", Consolas, monospace; }
  :root { --color-bg:#02040a; --color-border:#1c2a44; --color-text:#e8e6f0; --color-text-muted:#8a93ad; --color-primary:#05d9e8; --radius-md:6px; }
  #variant-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; gap: 8px; padding: 10px 16px;
    background: rgba(2,4,10,0.85); border-bottom: 1px solid var(--color-border); align-items: center; flex-wrap: wrap; }
  .variant-tab, .btn { font: inherit; font-size: 14px; color: var(--color-text-muted); background: transparent; border: 1px solid var(--color-border);
    padding: 6px 12px; border-radius: var(--radius-md); cursor: pointer; transition: all .15s ease; }
  .variant-tab:hover, .btn:hover { color: var(--color-text); border-color: var(--color-primary); }
  .variant-tab.active { color: var(--color-bg); background: var(--color-primary); border-color: var(--color-primary); }
  #blurb { color: var(--color-text-muted); font-size: 13px; margin-left: 8px; }
  #stage { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<div id="variant-nav">
  <button class="variant-tab active" data-v="a">A: Cinematic (every dive)</button>
  <button class="variant-tab" data-v="b">B: Quick (Retry)</button>
  <button class="btn" id="replay">↻ Replay</button>
  <span id="blurb"></span>
</div>
<div id="stage"><canvas id="cv" width="1600" height="900"></canvas></div>
<script>
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const W = 1600, H = 900, SPB = 0.5;
let V = 'a', t0 = performance.now(), skipped = false;
const BLURB = {
  a: 'Room → goggles slide on → CRT blink turns the world on → the arena fades in → 3-2-1 → dive. About 4 s. Any key skips.',
  b: 'Retry version: just the CRT blink and a single-beat count. Under 1 s.'
};
// timeline (seconds)
const TL = {
  a: { goggles: [0.0, 1.1], black: [1.1, 1.25], crt: [1.25, 1.65], arena: [1.65, 2.6], count: [2.6, 4.1], end: 4.1 },
  b: { goggles: [0, 0], black: [0, 0.05], crt: [0.05, 0.4], arena: [0.4, 0.6], count: [0.6, 1.1], end: 1.1 }
};
const parts = Array.from({ length: 80 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() }));
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const prog = (t, [a, b]) => b <= a ? (t >= b ? 1 : 0) : Math.min(Math.max((t - a) / (b - a), 0), 1);

function room(t) {
  g.fillStyle = '#07070b'; g.fillRect(0, 0, W, H);
  // desk + monitor glow + poster silhouettes: a real room before jacking in
  const gl = g.createRadialGradient(1150, 420, 0, 1150, 420, 520);
  gl.addColorStop(0, 'rgba(60,90,140,0.35)'); gl.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gl; g.fillRect(0, 0, W, H);
  g.fillStyle = '#0f1118'; g.fillRect(0, 640, W, 260);
  g.fillStyle = '#161a26'; g.fillRect(1000, 300, 300, 190); g.fillStyle = 'rgba(80,140,200,0.25)'; g.fillRect(1012, 312, 276, 166);
  g.fillStyle = '#12141c'; g.fillRect(180, 160, 160, 230); g.fillRect(380, 200, 120, 160);
  g.fillStyle = 'rgba(232,230,240,0.35)'; g.font = '16px Share Tech Mono, Consolas, monospace'; g.textAlign = 'left';
  g.fillText('NEURAL DIVE RIG · READY', 1030, 400);
}
function goggles(p) {
  // goggles descend from above and grow until the lenses fill the screen
  const s = 0.35 + ease(p) * 3.2, y = -300 + ease(p) * 750;
  g.save(); g.translate(800, y); g.scale(s, s);
  g.fillStyle = '#05060a'; g.strokeStyle = '#2a2f40'; g.lineWidth = 10;
  // strap
  g.beginPath(); g.moveTo(-420, -10); g.quadraticCurveTo(0, -120, 420, -10); g.lineWidth = 26; g.strokeStyle = '#1a1d28'; g.stroke();
  // frame
  g.beginPath(); g.roundRect(-330, -110, 660, 220, 110); g.fillStyle = '#10131d'; g.fill(); g.lineWidth = 8; g.strokeStyle = '#2f3550'; g.stroke();
  // lenses with a faint inner glow
  [-150, 150].forEach(x => {
    g.beginPath(); g.ellipse(x, 0, 130, 88, 0, 0, Math.PI * 2);
    const lg = g.createRadialGradient(x - 30, -30, 10, x, 0, 140);
    lg.addColorStop(0, 'rgba(5,217,232,0.35)'); lg.addColorStop(1, 'rgba(2,4,10,0.95)');
    g.fillStyle = lg; g.fill(); g.lineWidth = 6; g.strokeStyle = 'rgba(255,31,75,0.55)'; g.stroke();
  });
  // status LED
  g.fillStyle = p > 0.6 ? '#ff1f4b' : '#552030'; g.beginPath(); g.arc(0, -70, 7, 0, Math.PI * 2); g.fill();
  g.restore();
}
function arena(t, a) {
  g.fillStyle = '#02040a'; g.fillRect(0, 0, W, H);
  const beat = Math.pow(1 - ((t % SPB) / SPB), 3);
  const rad = g.createRadialGradient(800, 260, 0, 800, 260, 700 + beat * 40);
  rad.addColorStop(0, '#0b5f73'); rad.addColorStop(0.35, 'rgba(10,20,40,0.6)'); rad.addColorStop(1, 'rgba(2,4,10,0)');
  g.globalAlpha = a; g.fillStyle = rad; g.fillRect(0, 0, W, H);
  parts.forEach(p => { p.y -= 0.4 + p.z; if (p.y < 0) p.y = H; g.fillStyle = `rgba(160,230,255,${0.1 + p.z * 0.3})`; g.fillRect(p.x, p.y, 1 + p.z * 2, 1 + p.z * 2); });
  for (let i = 0; i < 26; i++) {
    const cx = 160 + i * 52, cy = 330 + Math.sin(i * 3.3) * 16; if (Math.abs(cx - 800) < 120) continue;
    g.fillStyle = `rgba(${i % 2 ? '244,114,182' : '34,211,238'},${0.2 + beat * 0.5})`;
    g.beginPath(); g.ellipse(cx, cy, 3, 6 + beat * 4, 0, 0, Math.PI * 2); g.fill();
  }
  // board grows out of the horizon
  const lanes = ['#22d3ee', '#fbbf24', '#f472b6', '#a3e635'];
  lanes.forEach((c, l) => {
    const f = l - 1.5; g.beginPath();
    const n = Math.floor(40 * a);
    for (let i = 0; i <= n; i++) {
      const d = 1 - i / 40, z = d * 10, s = 1 / (1 + z * 0.42), sm = 1 / (1 + 10 * 0.42), nn = (s - sm) / (1 - sm);
      const x = 800 + f * 150 * s, y = 250 + 510 * nn - f * f * 26 * nn;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.strokeStyle = c; g.lineWidth = 3; g.shadowColor = c; g.shadowBlur = 14; g.stroke(); g.shadowBlur = 0;
  });
  g.globalAlpha = 1;
}
function crt(p) {
  // dot → horizontal line → full picture, like an old TV switching on
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const pa = Math.min(p / 0.35, 1), pb = Math.max((p - 0.35) / 0.65, 0);
  const w = W * ease(pa), h = 4 + (H - 4) * ease(pb);
  g.fillStyle = `rgba(235,250,255,${1 - pb * 0.85})`;
  g.fillRect(800 - w / 2, 450 - h / 2, w, h);
  if (pb > 0) { g.fillStyle = `rgba(255,255,255,${(1 - pb) * 0.9})`; g.fillRect(0, 0, W, H); }
  // a flicker of boot text inside the line
  if (p > 0.2 && p < 0.7) { g.fillStyle = 'rgba(2,4,10,0.9)'; g.font = '18px Share Tech Mono, Consolas, monospace'; g.textAlign = 'center'; g.fillText('LINK ESTABLISHED', 800, 456); }
}

function frame() {
  const T = TL[V], t = (performance.now() - t0) / 1000;
  if (skipped || t >= T.end + 2.5) { arena(t, 1); text('▶ SONG PLAYING (board would start here)', 0.9); return requestAnimationFrame(frame); }
  if (t < T.goggles[1]) { room(t); goggles(prog(t, T.goggles)); }
  else if (t < T.black[1]) { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); }
  else if (t < T.crt[1]) { crt(prog(t, T.crt)); }
  else {
    arena(t, ease(prog(t, T.arena)));
    if (t >= T.count[0]) {
      const steps = V === 'a' ? ['3', '2', '1'] : ['1'];
      const i = Math.floor((t - T.count[0]) / SPB);
      if (i < steps.length) bigCount(steps[i], ((t - T.count[0]) % SPB) / SPB);
      else if (t < T.end + 0.6) bigCount('DIVE', (t - T.end) / 0.6);
      else text('▶ SONG PLAYING (board would start here)', 0.9);
    }
  }
  requestAnimationFrame(frame);
}
function bigCount(s, p) {
  g.globalAlpha = 1 - p; g.fillStyle = '#e8e6f0'; g.textAlign = 'center';
  g.font = `${Math.round(150 * (1.2 - 0.2 * p))}px Share Tech Mono, Consolas, monospace`;
  g.shadowColor = '#05d9e8'; g.shadowBlur = 30; g.fillText(s, 800, 520); g.shadowBlur = 0; g.globalAlpha = 1;
}
function text(s, a) { g.fillStyle = `rgba(232,230,240,${a})`; g.font = '22px Share Tech Mono, Consolas, monospace'; g.textAlign = 'center'; g.fillText(s, 800, 860); }
function restart() { t0 = performance.now(); skipped = false; }
document.getElementById('replay').onclick = restart;
addEventListener('keydown', () => { skipped = true; });
cv.onclick = () => { skipped = true; };
document.querySelectorAll('.variant-tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.variant-tab').forEach(x => x.classList.remove('active')); b.classList.add('active');
  V = b.dataset.v; document.getElementById('blurb').textContent = BLURB[V]; restart();
});
document.getElementById('blurb').textContent = BLURB[V];
requestAnimationFrame(frame);
</script>
</body>
</html>
